# ==============================================================================
# Coturn TURN/STUN Server Production Configuration for ConnectX WebRTC
# ==============================================================================
# Place this file at: /etc/turnserver.conf on your Linux server
#
# Replace the placeholders:
#   - YOUR_DOMAIN_OR_IP: Your server's public domain (e.g. turn.yourdomain.com) or public IP
#   - YOUR_STATIC_AUTH_SECRET: A 64-char hex string (generate with: openssl rand -hex 32)
# ==============================================================================

# Network & Listening Ports
listening-port=3478
tls-listening-port=5349
alt-listening-port=0
alt-tls-listening-port=0

# Dynamic Relay Port Range for WebRTC Media Streams (RTP/RTCP)
# Must be opened in your VPS firewall / AWS Security Group
min-port=49152
max-port=65535

# Fingerprint attribute in TURN messages (RFC 5389 mandatory for WebRTC)
fingerprint

# Long-term Credential Mechanism
lt-cred-mech

# Use dynamic time-limited HMAC-SHA1 tokens (RFC 5766 / TURN REST API)
# This prevents hardcoding permanent user credentials in client applications
use-auth-secret
static-auth-secret=YOUR_STATIC_AUTH_SECRET

# Realm: Unique identifier for your TURN service (typically your domain name or IP)
realm=YOUR_DOMAIN_OR_IP

# Server External & Internal IP Mapping
# (Required if your VPS is behind a 1:1 NAT like AWS EC2, GCP Compute Engine, or Azure)
# If your server has an internal IP like 10.0.0.4 and public IP like 203.0.113.195, uncomment:
# external-ip=PUBLIC_IP/PRIVATE_IP
# If your server has direct public IP (e.g. DigitalOcean, Hetzner, Linode), uncomment:
# external-ip=YOUR_PUBLIC_IP

# Security & Anti-Abuse Hardening
no-multicast-peers
no-loopback-peers
no-cli
stale-nonce=600

# TLS / TURNS Configuration (Encrypted TURN on port 5349)
# Uncomment once you issue a free Let's Encrypt certificate via Certbot:
# cert=/etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem
# pkey=/etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem
# cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"

# Logging & Performance
syslog
verbose
no-stdout-log
max-allocate-lifetime=3600
channel-lifetime=600
permission-lifetime=300
