<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="cx-grad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="cx-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="#0f172a" />
  <!-- Node lines -->
  <path d="M12 12L36 36M36 12L12 36" stroke="url(#cx-grad)" stroke-width="4.5" stroke-linecap="round" filter="url(#cx-glow)" />
  <!-- Central interconnect ring -->
  <circle cx="24" cy="24" r="5" fill="#0f172a" stroke="url(#cx-grad)" stroke-width="3" />
  <!-- Node dots -->
  <circle cx="12" cy="12" r="3.5" fill="#6366f1" />
  <circle cx="36" cy="12" r="3.5" fill="#8b5cf6" />
  <circle cx="12" cy="36" r="3.5" fill="#8b5cf6" />
  <circle cx="36" cy="36" r="3.5" fill="#ec4899" />
</svg>